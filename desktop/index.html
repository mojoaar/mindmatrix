<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>MindMatrix Desktop</title>
  <style>
    :root { --bg:#2e3440;--bg-card:#3b4252;--fg:#eceff4;--fg-muted:#81a1c1;--accent:#5e81ac;--accent-hover:#81a1c1;--border:#4c566a;--danger:#bf616a;--danger-bg:rgba(191,97,106,0.1);--input-bg:#434c5e;--radius:8px }
    * { margin:0;padding:0;box-sizing:border-box }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem }
    .card { background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;width:440px;max-width:100%;text-align:center }
    h1 { font-size:1.4rem;font-weight:700;margin-bottom:0.25rem }
    .sub { font-size:0.85rem;color:var(--fg-muted);margin-bottom:1.5rem }
    label { display:block;text-align:left;font-size:0.8rem;font-weight:600;color:var(--fg-muted);margin-bottom:0.3rem }
    input { width:100%;padding:0.6rem 0.75rem;font-size:0.9rem;color:var(--fg);background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);outline:none }
    input:focus { border-color:var(--accent) }
    .f { margin-bottom:1rem }
    .tabs { display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.25rem }
    .tab { flex:1;padding:0.5rem;font-size:0.85rem;font-weight:600;background:var(--bg);color:var(--fg-muted);border:none;cursor:pointer }
    .tab.on { background:var(--accent);color:#fff }
    .tab:not(.on):hover { background:var(--input-bg) }
    .btn { width:100%;padding:0.65rem;font-size:0.9rem;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:var(--radius);cursor:pointer;margin-top:0.25rem }
    .btn:hover { background:var(--accent-hover) }
    .btn:disabled { opacity:0.5;cursor:not-allowed }
    .err { background:var(--danger-bg);border:1px solid var(--danger);border-radius:var(--radius);padding:0.5rem 0.75rem;font-size:0.8rem;color:var(--danger);margin-top:1rem;display:none;text-align:left;word-break:break-all }
    .err.on { display:block }
    .hint { margin-top:1.5rem;font-size:0.75rem;color:var(--fg-muted);line-height:1.6 }
    .spin { display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:s 0.6s linear infinite;margin-right:0.3rem;vertical-align:middle }
    @keyframes s { to { transform:rotate(360deg) } }
  </style>
</head>
<body>
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="48" height="48" style="margin-bottom:0.5rem"><defs><linearGradient id="r1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#bf616a"/><stop offset="100%" stop-color="#b48ead"/></linearGradient><linearGradient id="r2" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#88c0d0"/><stop offset="100%" stop-color="#5e81ac"/></linearGradient><linearGradient id="r3" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#a3be8c"/><stop offset="100%" stop-color="#ebcb8b"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#2e3440"/><path d="M100,380 L160,150 L220,150 L160,380 Z" fill="url(#r1)"/><path d="M160,150 L256,280 L290,260 L220,150 Z" fill="url(#r2)" opacity="0.95"/><path d="M256,280 L352,150 L392,165 L290,260 Z" fill="url(#r3)" opacity="0.9"/><path d="M352,150 L412,380 L352,380 L306,210 Z" fill="url(#r1)" opacity="0.85"/><path d="M160,380 L256,310 L352,380 L256,340 Z" fill="url(#r2)" style="mix-blend-mode:overlay"/></svg>
    <h1>MindMatrix Desktop</h1>
    <p class="sub">Connect to your self-hosted server</p>
    <div class="f"><label>Server URL</label><input id="sv" type="url" placeholder="https://mindmatrix.johansen.foo" /></div>
    <div class="tabs">
      <button type="button" class="tab on" id="tbS">Sign In</button>
      <button type="button" class="tab" id="tbT">API Token</button>
    </div>
    <div id="fmS">
      <div class="f"><label>Email</label><input id="em" type="email" placeholder="you@example.com" /></div>
      <div class="f"><label>Password</label><input id="pw" type="password" placeholder="••••••••" /></div>
      <button type="button" class="btn" id="btS">Sign In</button>
    </div>
    <div id="fmT" style="display:none">
      <div class="f"><label>API Token</label><input id="tk" type="password" placeholder="mm_xxxxxxxx..." /></div>
      <button type="button" class="btn" id="btT">Connect</button>
    </div>
    <div class="err" id="er"></div>
    <p class="hint" id="hiS">Find your API token in <strong>Settings → API Tokens</strong> on the server.</p>
    <p class="hint" id="hiT" style="display:none">Create an API token on your server, then paste it above.</p>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      console.log("TAURI:", window.__TAURI__);

      function $(id) { return document.getElementById(id) }
      function sh(m) { var e=$("er");e.textContent=m;e.classList.add("on") }
      function cl() { $("er").classList.remove("on") }
      function gs() { var r=$("sv").value.trim();return r?r.replace(/\/+$/,""):"" }
      function sr(url,ad) {
        try { localStorage.setItem("mindmatrix-desktop-url",url);for(var k in ad)localStorage.setItem("mindmatrix-desktop-"+k,ad[k]) } catch(e) {}
        window.location.replace(url+"/dashboard");
      }
      function sc(v) {
        var bs=document.querySelectorAll(".btn");
        for(var i=0;i<bs.length;i++){bs[i].disabled=v;bs[i].innerHTML=v?'<span class="spin"></span>Connecting...':bs[i].dataset.t||bs[i].textContent}
        if(!v)for(var j=0;j<bs.length;j++){var b=bs[j];if(!b.dataset.t)b.dataset.t=b.textContent}
      }
      function sw(t) {
        $("tbS").classList.toggle("on",t==="signin");
        $("tbT").classList.toggle("on",t==="token");
        $("fmS").style.display=t==="signin"?"":"none";
        $("fmT").style.display=t==="token"?"":"none";
        $("hiS").style.display=t==="signin"?"":"none";
        $("hiT").style.display=t==="token"?"":"none";
        cl();
      }

      $("tbS").addEventListener("click",function(){sw("signin")});
      $("tbT").addEventListener("click",function(){sw("token")});

      $("btS").addEventListener("click",async function(){
        cl();var u=gs();if(!u)return sh("Enter server URL.");
        var e=$("em").value.trim(),p=$("pw").value;
        if(!e||!p)return sh("Enter email and password.");

        if(!window.__TAURI__?.core?.invoke) {
          sh("Tauri bridge missing. Check DevTools console.");
          console.error("__TAURI__:", window.__TAURI__);
          return;
        }

        sc(true);
        try {
          var ok = await window.__TAURI__.core.invoke("auth_signin",{url:u,email:e,password:p});
          if (!ok) return sh("Invalid email or password.");
          try { var ck = await window.__TAURI__.core.invoke("read_cookie"); if (ck) document.cookie = ck; } catch(e) {}
          sr(u,{authMethod:"session"});
        } catch(x) { sh(String(x)) } finally { sc(false) }
      });

      $("btT").addEventListener("click",async function(){
        cl();var u=gs();if(!u)return sh("Enter server URL.");
        var tk=$("tk").value.trim();if(!tk)return sh("Enter API token.");

        if(!window.__TAURI__?.core?.invoke) {
          sh("Tauri bridge missing. Check DevTools console.");
          return;
        }

        sc(true);
        try {
          var tok = await window.__TAURI__.core.invoke("auth_verify_token",{url:u,token:tk});
          if (!tok) return sh("Invalid API token.");
          try { var ck2 = await window.__TAURI__.core.invoke("read_cookie"); if (ck2) document.cookie = ck2; } catch(e) {}
          sr(u,{authToken:tk,authMethod:"token"});
        } catch(x) { sh(String(x)) } finally { sc(false) }
      });

      // Auto-login
      try {
        var u=localStorage.getItem("mindmatrix-desktop-url");
        if(u) {
          $("sv").value=u;
          var tk=localStorage.getItem("mindmatrix-desktop-authToken");
          if(tk) {
            $("tk").value=tk;
            sw("token");
            return;
          }
          var m=localStorage.getItem("mindmatrix-desktop-authMethod");
          if(m==="session") {
            sw("signin");
            return;
          }
        }
      } catch(e) {}
      sw("signin");
    });
  </script>
</body>
</html>
