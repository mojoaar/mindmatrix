<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>MindMatrix Desktop</title>
</head>
<body>
<script>
(function() {
  var url = "https://mindmatrix.johansen.foo";
  try { var s = localStorage.getItem("mindmatrix-desktop-url"); if (s) url = s; } catch(e) {}
  var authToken = null;
  try { authToken = localStorage.getItem("mindmatrix-desktop-authToken"); } catch(e) {}

  if (authToken) {
    window.location.replace(url + "/dashboard?" + Date.now());
  } else {
    window.location.replace(url + "/connect?" + Date.now());
  }
})();
</script>
</body>
</html>
